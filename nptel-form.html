<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NPTEL Course Form - IIPS Skill Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar('nptel')}"></div>

<main class="container">
    <div class="page-header">
        <h2 th:text="${item.id == null} ? 'Add NPTEL Course' : 'Edit NPTEL Course'">NPTEL Course</h2>
    </div>

    <form class="card form-card" th:action="@{/nptel/save}" th:object="${item}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="form-group">
            <label for="courseName">Course Name <span class="req">*</span></label>
            <input type="text" id="courseName" th:field="*{courseName}">
            <span class="field-error" th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}"></span>
        </div>
        <div class="form-group">
            <label for="courseId">Course ID</label>
            <input type="text" id="courseId" th:field="*{courseId}">
            <span class="field-error" th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></span>
        </div>
        <div class="form-group">
            <label for="duration">Duration</label>
            <input type="text" id="duration" th:field="*{duration}">
            <span class="field-error" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></span>
        </div>
        <div class="form-group">
            <label for="completionDate">Completion Date</label>
            <input type="date" id="completionDate" th:field="*{completionDate}">
            <span class="field-error" th:if="${#fields.hasErrors('completionDate')}" th:errors="*{completionDate}"></span>
        </div>
        <div class="form-group">
            <label for="score">Score (0-100) <span class="req">*</span></label>
            <input type="number" id="score" min="0" max="100" th:field="*{score}">
            <span class="field-error" th:if="${#fields.hasErrors('score')}" th:errors="*{score}"></span>
        </div>
        <div class="form-group">
            <label for="grade">Grade</label>
            <select id="grade" th:field="*{grade}">
                <option th:each="o : ${gradeOptions}" th:value="${o}" th:text="${o}"></option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('grade')}" th:errors="*{grade}"></span>
        </div>
        <div class="form-group form-check">
            <input type="checkbox" id="certificateAvailable" th:field="*{certificateAvailable}">
            <label for="certificateAvailable">Certificate Available</label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-secondary" th:href="@{/nptel}">Cancel</a>
        </div>
    </form>
</main>

<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
