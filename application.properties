spring.application.name=iips-skill-tracker

# ============================================================
# DATABASE SETTINGS
# >>> CHANGE ONLY THE PASSWORD BELOW <<<
# Replace YOUR_MYSQL_PASSWORD with your own local MySQL root password.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/iips_skill_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

# Hibernate creates / updates the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

server.port=8080
