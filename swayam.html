<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SWAYAM Courses - IIPS Skill Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar('swayam')}"></div>

<main class="container">
    <div class="page-header">
        <h2>SWAYAM Courses</h2>
        <a class="btn btn-primary" th:href="@{/swayam/new}">+ Add SWAYAM Course</a>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <div class="card table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Course Name</th>
                    <th>Course ID</th>
                    <th>Duration</th>
                    <th>Completion Date</th>
                    <th>Score</th>
                    <th>Certificate</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="i : ${items}">
                    <td th:text="${i.courseName} ?: '-'"></td>
                    <td th:text="${i.courseId} ?: '-'"></td>
                    <td th:text="${i.duration} ?: '-'"></td>
                    <td th:text="${i.completionDate != null ? #temporals.format(i.completionDate, 'dd-MM-yyyy') : '-'}"></td>
                    <td th:text="${i.score} ?: '-'"></td>
                    <td><span th:class="${i.certificateAvailable} ? 'badge badge-yes' : 'badge badge-no'" th:text="${i.certificateAvailable} ? 'Yes' : 'No'"></span></td>
                    <td class="actions">
                        <a class="btn btn-small btn-edit" th:href="@{/swayam/edit/{id}(id=${i.id})}">Edit</a>
                        <form th:action="@{/swayam/delete/{id}(id=${i.id})}" method="post"
                              onsubmit="return confirmDelete('this SWAYAM Course');">
                            <button type="submit" class="btn btn-small btn-delete">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(items)}">
                    <td colspan="7" class="empty">No records yet. Click "Add SWAYAM Course" to create one.</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
