<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - IIPS Skill Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
<div class="login-box">
    <h1>IIPS</h1>
    <h2>Skill Development &amp; Certification Tracking System</h2>

    <div class="alert alert-error" th:if="${error != null}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${param.logout != null}">You have been logged out.</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" th:value="${email}" placeholder="student@iips.edu" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <p class="demo-hint">Demo login: <strong>student@iips.edu</strong> / <strong>1234</strong></p>
</div>
</body>
</html>
