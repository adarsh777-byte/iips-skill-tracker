<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Certifications - IIPS Skill Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar('certifications')}"></div>

<main class="container">
    <div class="page-header">
        <h2>Certifications</h2>
        <a class="btn btn-primary" th:href="@{/certifications/new}">+ Add Certification</a>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <div class="card table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Certification Name</th>
                    <th>Organization</th>
                    <th>Certificate ID</th>
                    <th>Issue Date</th>
                    <th>Expiry Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="i : ${items}">
                    <td th:text="${i.certificationName} ?: '-'"></td>
                    <td th:text="${i.issuingOrganization} ?: '-'"></td>
                    <td th:text="${i.certificateId} ?: '-'"></td>
                    <td th:text="${i.issueDate != null ? #temporals.format(i.issueDate, 'dd-MM-yyyy') : '-'}"></td>
                    <td th:text="${i.expiryDate != null ? #temporals.format(i.expiryDate, 'dd-MM-yyyy') : '-'}"></td>
                    <td><span th:class="'badge badge-' + ${#strings.toLowerCase(#strings.replace(i.status, ' ', '-'))}" th:text="${i.status}"></span></td>
                    <td class="actions">
                        <a class="btn btn-small btn-edit" th:href="@{/certifications/edit/{id}(id=${i.id})}">Edit</a>
                        <form th:action="@{/certifications/delete/{id}(id=${i.id})}" method="post"
                              onsubmit="return confirmDelete('this Certification');">
                            <button type="submit" class="btn btn-small btn-delete">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(items)}">
                    <td colspan="7" class="empty">No records yet. Click "Add Certification" to create one.</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
