<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Certification Form - IIPS Skill Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar('certifications')}"></div>

<main class="container">
    <div class="page-header">
        <h2 th:text="${item.id == null} ? 'Add Certification' : 'Edit Certification'">Certification</h2>
    </div>

    <form class="card form-card" th:action="@{/certifications/save}" th:object="${item}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="form-group">
            <label for="certificationName">Certification Name <span class="req">*</span></label>
            <input type="text" id="certificationName" th:field="*{certificationName}">
            <span class="field-error" th:if="${#fields.hasErrors('certificationName')}" th:errors="*{certificationName}"></span>
        </div>
        <div class="form-group">
            <label for="issuingOrganization">Issuing Organization <span class="req">*</span></label>
            <input type="text" id="issuingOrganization" th:field="*{issuingOrganization}">
            <span class="field-error" th:if="${#fields.hasErrors('issuingOrganization')}" th:errors="*{issuingOrganization}"></span>
        </div>
        <div class="form-group">
            <label for="certificateId">Certificate ID</label>
            <input type="text" id="certificateId" th:field="*{certificateId}">
            <span class="field-error" th:if="${#fields.hasErrors('certificateId')}" th:errors="*{certificateId}"></span>
        </div>
        <div class="form-group">
            <label for="issueDate">Issue Date</label>
            <input type="date" id="issueDate" th:field="*{issueDate}">
            <span class="field-error" th:if="${#fields.hasErrors('issueDate')}" th:errors="*{issueDate}"></span>
        </div>
        <div class="form-group">
            <label for="expiryDate">Expiry Date</label>
            <input type="date" id="expiryDate" th:field="*{expiryDate}">
            <span class="field-error" th:if="${#fields.hasErrors('expiryDate')}" th:errors="*{expiryDate}"></span>
        </div>
        <div class="form-group">
            <label for="status">Status <span class="req">*</span></label>
            <select id="status" th:field="*{status}">
                <option th:each="o : ${statusOptions}" th:value="${o}" th:text="${o}"></option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-secondary" th:href="@{/certifications}">Cancel</a>
        </div>
    </form>
</main>

<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
