<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skills - IIPS Skill Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar('skills')}"></div>

<main class="container">
    <div class="page-header">
        <h2>Skills</h2>
        <a class="btn btn-primary" th:href="@{/skills/new}">+ Add Skill</a>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <div class="card table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Skill Name</th>
                    <th>Category</th>
                    <th>Skill Level</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="i : ${items}">
                    <td th:text="${i.skillName} ?: '-'"></td>
                    <td th:text="${i.category} ?: '-'"></td>
                    <td><span th:class="'badge badge-' + ${#strings.toLowerCase(#strings.replace(i.skillLevel, ' ', '-'))}" th:text="${i.skillLevel}"></span></td>
                    <td class="actions">
                        <a class="btn btn-small btn-edit" th:href="@{/skills/edit/{id}(id=${i.id})}">Edit</a>
                        <form th:action="@{/skills/delete/{id}(id=${i.id})}" method="post"
                              onsubmit="return confirmDelete('this Skill');">
                            <button type="submit" class="btn btn-small btn-delete">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(items)}">
                    <td colspan="4" class="empty">No records yet. Click "Add Skill" to create one.</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
